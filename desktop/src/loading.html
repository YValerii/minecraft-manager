<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Minecraft Manager</title>
  <style>
    html, body { height: 100%; margin: 0; background: #121410; }
    body { display: flex; align-items: center; justify-content: center; }
    div {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #43483f; border-top-color: #96d886;
      animation: spin 0.9s linear infinite;
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #f9faf3; }
      div { border-color: #c3c8bb; border-top-color: #2f6b27; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body><div role="progressbar" aria-label="Loading"></div></body>
</html>
