<header class="topbar">
  <div class="inner">
    <a class="brand" routerLink="/">
      <span class="logo" aria-hidden="true"></span>
      <span>Minecraft Manager</span>
    </a>
    <nav class="tabs" [attr.aria-label]="i18n.t('app.sectionsAriaLabel')">
      @for (tab of tabs; track tab.link) {
        <a class="tab" [routerLink]="tab.link" routerLinkActive="active">
          <span class="emoji" aria-hidden="true">{{ tab.emoji }}</span>{{ i18n.t(tab.labelKey) }}
        </a>
      }
    </nav>
    <button
      type="button"
      class="btn primary small launch"
      [disabled]="!launcherAvailable() || launching()"
      [title]="i18n.t(launcherAvailable() ? 'app.launcher.title' : 'app.launcher.notFound')"
      (click)="launchMinecraft()"
    >
      @if (launching()) {
        <span class="spin" aria-hidden="true"></span>
      } @else {
        <span aria-hidden="true">▶</span>
      }
      {{ i18n.t('app.launcher.label') }}
    </button>
    <a class="tab settings" routerLink="/settings" routerLinkActive="active">
      <span class="emoji" aria-hidden="true">⚙️</span>{{ i18n.t('app.settingsLink') }}
    </a>
    <select #langSelect class="lang-switch" [attr.aria-label]="i18n.t('langSwitcher.ariaLabel')" (change)="setLang($any(langSelect.value))">
      @for (l of i18n.languages; track l.code) {
        <option [value]="l.code" [selected]="l.code === i18n.lang()">{{ l.name }}</option>
      }
    </select>
    <button
      type="button"
      class="btn small theme-toggle"
      [title]="i18n.t(theme.theme() === 'dark' ? 'app.theme.toLight' : 'app.theme.toDark')"
      [attr.aria-label]="i18n.t(theme.theme() === 'dark' ? 'app.theme.toLight' : 'app.theme.toDark')"
      (click)="theme.toggle()"
    >
      <span aria-hidden="true">{{ theme.theme() === 'dark' ? '☀️' : '🌙' }}</span>
    </button>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>

@if (toast(); as t) {
  <p class="banner toast" [class.ok]="t.kind === 'ok'" [class.error]="t.kind === 'error'" role="status">{{ t.text }}</p>
}
