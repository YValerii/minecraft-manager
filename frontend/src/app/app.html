<header class="topbar">
  <div class="inner">
    <a class="brand" routerLink="/">
      <span class="logo" aria-hidden="true"></span>
      <span>Minecraft Manager</span>
    </a>
    <nav class="tabs" [attr.aria-label]="i18n.t('app.sectionsAriaLabel')">
      @for (tab of tabs; track tab.link) {
        <a class="tab" [routerLink]="tab.link" routerLinkActive="active">
          <span class="emoji" aria-hidden="true">{{ tab.emoji }}</span>{{ i18n.t(tab.labelKey) }}
        </a>
      }
    </nav>
    <a class="tab settings" routerLink="/settings" routerLinkActive="active">
      <span class="emoji" aria-hidden="true">⚙️</span>{{ i18n.t('app.settingsLink') }}
    </a>
    <select #langSelect class="lang-switch" [attr.aria-label]="i18n.t('langSwitcher.ariaLabel')" (change)="setLang($any(langSelect.value))">
      @for (l of i18n.languages; track l.code) {
        <option [value]="l.code" [selected]="l.code === i18n.lang()">{{ l.name }}</option>
      }
    </select>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
