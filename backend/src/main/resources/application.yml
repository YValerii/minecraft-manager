server:
  port: 8080

spring:
  application:
    name: minecraft-manager

# Initial values. After the first run, settings live in a local JSON file
# (app.data-dir/settings.json) and are changed on the "Settings" page.
app:
  # Empty = %APPDATA%\.minecraft (Windows) or ~/.minecraft
  minecraft-path: ${APP_MINECRAFT_PATH:}
  game-version: ${APP_GAME_VERSION:26.3}
  loader: ${APP_LOADER:neoforge}
  provider: ${APP_PROVIDER:MODRINTH}
  curseforge-api-key: ${CURSEFORGE_API_KEY:}
  cache-ttl-minutes: 60
  # Where settings.json and identity-cache.json are stored.
  data-dir: ${APP_DATA_DIR:./data}
