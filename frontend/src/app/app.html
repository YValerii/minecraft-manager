<mat-sidenav-container class="shell">
  <mat-sidenav
    class="nav"
    [mode]="compact() ? 'over' : 'side'"
    [opened]="!compact() || navOpen()"
    [disableClose]="!compact()"
    (openedChange)="onNavChange($event)"
  >
    <a class="brand" routerLink="/" (click)="closeNav()">
      <img src="logo.svg" alt="" width="40" height="40" />
      <span>Minecraft Manager</span>
    </a>

    <nav class="sections" [attr.aria-label]="i18n.t('app.sectionsAriaLabel')">
      <mat-nav-list>
        @for (tab of tabs; track tab.link) {
          <a
            mat-list-item
            class="tab"
            [routerLink]="tab.link"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            #active="routerLinkActive"
            [activated]="active.isActive"
            (click)="closeNav()"
          >
            <mat-icon matListItemIcon [svgIcon]="tab.icon" aria-hidden="true" />
            <span matListItemTitle>{{ i18n.t(tab.labelKey) }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>

    <mat-nav-list class="bottom">
      <a
        mat-list-item
        class="settings"
        routerLink="/settings"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        #settingsActive="routerLinkActive"
        [activated]="settingsActive.isActive"
        (click)="closeNav()"
      >
        <mat-icon matListItemIcon svgIcon="settings" aria-hidden="true" />
        <span matListItemTitle>{{ i18n.t('app.settingsLink') }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main">
    <mat-toolbar class="topbar">
      @if (compact()) {
        <button
          matIconButton
          type="button"
          class="menu-toggle"
          [attr.aria-label]="i18n.t('app.openNav')"
          [matTooltip]="i18n.t('app.openNav')"
          (click)="navOpen.set(true)"
        >
          <mat-icon svgIcon="menu" />
        </button>
        <img class="compact-logo" src="logo.svg" alt="Minecraft Manager" width="32" height="32" />
      }
      <span class="spacer"></span>

      <!-- The tooltip sits on a wrapper because a disabled button doesn't receive hover. -->
      <span [matTooltip]="i18n.t(launcherAvailable() ? 'app.launcher.title' : 'app.launcher.notFound')">
        <button
          matButton="filled"
          type="button"
          class="launch"
          [disabled]="!launcherAvailable() || launching()"
          (click)="launchMinecraft()"
        >
          @if (launching()) {
            <mat-spinner matButtonIcon class="spin" diameter="18" />
          } @else {
            <mat-icon svgIcon="play_arrow" aria-hidden="true" />
          }
          {{ i18n.t('app.launcher.label') }}
        </button>
      </span>

      <button
        matIconButton
        type="button"
        class="lang-switch"
        [matMenuTriggerFor]="languages"
        [attr.aria-label]="i18n.t('langSwitcher.ariaLabel')"
        [matTooltip]="i18n.t('langSwitcher.ariaLabel')"
      >
        <mat-icon svgIcon="language" />
      </button>
      <mat-menu #languages="matMenu" class="lang-menu">
        @for (l of i18n.languages; track l.code) {
          <button
            mat-menu-item
            type="button"
            role="menuitemradio"
            class="lang-option"
            [attr.lang]="l.code"
            [attr.aria-checked]="l.code === i18n.lang()"
            (click)="setLang(l.code)"
          >
            @if (l.code === i18n.lang()) {
              <mat-icon svgIcon="check" aria-hidden="true" />
            } @else {
              <mat-icon aria-hidden="true" />
            }
            <span>{{ l.name }}</span>
          </button>
        }
      </mat-menu>

      <button
        matIconButton
        type="button"
        class="theme-toggle"
        [matTooltip]="i18n.t(theme.theme() === 'dark' ? 'app.theme.toLight' : 'app.theme.toDark')"
        [attr.aria-label]="i18n.t(theme.theme() === 'dark' ? 'app.theme.toLight' : 'app.theme.toDark')"
        (click)="theme.toggle()"
      >
        <mat-icon [svgIcon]="theme.theme() === 'dark' ? 'light_mode' : 'dark_mode'" />
      </button>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
